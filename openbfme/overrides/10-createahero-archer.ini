; OpenBFME override: the Create-a-Hero archer's bow from the High Elves mod (github.com/deepakjoshiss/highelves, data/ini/weapon.ini and
; data/ini/createaherogamedata.inc). Loaded after the game's own INI files with retail's reload (docs/OVERRIDES.md): each Weapon block below
; replaces the game's block of that name. Changes against RotWK 2.01:
;   - the bow's own timing (CREATE_A_HERO_BOW_*), no longer Faramir's: reload 1.2-1.6 s (was 1.5-2.0 s)
;   - arrow damage 150 (was 80), the Corrupted Man's upgraded arrow 300 (was 120); the arrow bonus damage 20 per level (was 25)
;   - the arrow bonuses (levels 1-4) apply to the archer class only; fire arrows at level 2, Silverthorn arrows at level 3
;   - level 4: the mod's NoldorGoldenArrowProjectile needs FX the base game lacks (NoldorSilverArrowTrail, FX_NoldorSilverArrowDeath);
;     until they are imported too the level 4 arrow is the base game's MirkwoodArcherSilverthornProjectile (the mod's own commented original)
;   - new: the mod's super bow (CreateAHeroSuperRangedWeapon) for the Elven Archer's 4th bow choice, at the end of this file

