; OpenBFME override (docs/OVERRIDES.md, OpenBFMESpellStoreMenu): the spell store menu per faction. The mod's 20-spell menu is SpellStoreHighElves.apt; every
; faction not named here opens 2.02's SpellStore.apt. Until the High Elves faction exists the four good factions keep the mod's combined spell tree, so they
; keep its menu too; then only FactionHighElves stays.

GameData
  OpenBFMESpellStoreMenu = FactionElves SpellStoreHighElves
  OpenBFMESpellStoreMenu = FactionMen SpellStoreHighElves
  OpenBFMESpellStoreMenu = FactionDwarves SpellStoreHighElves
  OpenBFMESpellStoreMenu = FactionArnor SpellStoreHighElves
End
