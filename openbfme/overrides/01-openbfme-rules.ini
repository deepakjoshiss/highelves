; OpenBFME override: rules OpenBFME adds for this mod (docs/OVERRIDES.md, "OpenBFME-only values"); retail has no such field.
;   - OpenBFMEAutoAcquireWithinWeaponRange: a unit that auto-acquires (AutoAcquireEnemiesWhenIdle Yes, not No) shoots, idle or guarding, what its current weapon
;     reaches from where it stands when that is farther than its vision, where its player sees it clear (heroes in the Hold Ground stance, the Create-a-Hero,
;     horse archers, ships ...). Units that wait for orders (No: the Mighty Catapult, the Vigilant Ent) keep waiting.
;     Garrisoned units keep their whole tower range (not capped by their vision), except in a hold stance (Hold Ground, Porcupine).
;   - OpenBFMETeamCommandPoints: in a skirmish or multiplayer game a player's command point cap is its team's share of the game's army (the table's cap of the
;     live player count x the live players, shared equally by the teams and within a team by its players), never below the table's cap, never above the
;     two-player cap; computed again whenever a player is defeated, and never lowered. The table is 02-command-points.ini.

GameData
  OpenBFMEAutoAcquireWithinWeaponRange = Yes
  OpenBFMETeamCommandPoints = Yes
End
