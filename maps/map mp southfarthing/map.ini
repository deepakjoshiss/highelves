WaterTransparency
	ReflectionPlaneZ = 142.0;
	ReflectionOn = Yes
End

; High Elves mod: 2.02's map.ini for this map, corrected. 2.02 adds a second ModuleTag_01 (and a second Body ModuleTag_03) to
; CINEsmokeSmall inside AddModule; RotWK refuses a module tag the object already has in a map override (RW 0x73F488: only a ChildObject
; replaces one), so neither the original game nor OpenBFME could start the map. Same intent, legal form: ReplaceModule swaps the base
; smoke for the burning-tree smoke and embers, AddModule adds the smoke model, and the design fields are set directly (the Body was
; the base's own, unchanged, so it is left out).
Object CINEsmokeSmall

  ; *** ART Parameters ***
AddModule
  Draw = W3DScriptedModelDraw ModuleTag_07
    DefaultModelConditionState
      Model               = CINEsmokeSmall
    End
  End
End
ReplaceModule ModuleTag_01
  Draw = W3DScriptedModelDraw ModuleTag_08
    DefaultModelConditionState
      Model = NONE
		ParticleSysBone = NONE burningTreeSmoke
		ParticleSysBone = NONE burningTreeEmbers
    End    
    ModelConditionState = WORLD_BUILDER
			Model = locator				
	End
  End
End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Smoke
  EditorSorting   = MISC_MAN_MADE
  Browser = CINEMATICS SYSTEM

  ; *** ENGINEERING Parameters ***  
  KindOf          = IMMOBILE
  Shadow          = NONE

  Geometry = CYLINDER
  GeometryMajorRadius = 0.5
  GeometryMinorRadius = 0.5
  GeometryHeight = 0.5
  GeometryIsSmall = Yes
End
