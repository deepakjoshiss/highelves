; OpenBFME's rules for this mod (openbfme-godot docs/MODS.md): OpenBFME reads this file after the game's INI; the original game never opens it,
; so the mod's 2.02 files stay loadable by it (an OpenBFME field in them would stop it, and OpenBFME refuses one there too).
;   - OpenBFMEAutoAcquireWithinWeaponRange: a unit that auto-acquires (AutoAcquireEnemiesWhenIdle Yes, not No) shoots, idle or guarding, what its current weapon
;     reaches from where it stands when that is farther than its vision, where its player sees it clear (heroes in the Hold Ground stance, the Create-a-Hero,
;     horse archers, ships ...). Units that wait for orders (No: the Mighty Catapult, the Vigilant Ent) keep waiting.
;     Garrisoned units keep their whole tower range (not capped by their vision), except in a hold stance (Hold Ground, Porcupine).
;   - OpenBFMETeamCommandPoints: in a skirmish or multiplayer game a player's command point cap is its team's share of the game's army (the table's cap of the
;     live player count x the live players, shared equally by the teams and within a team by its players), never below the table's cap, never above the
;     two-player cap; computed again whenever a player is defeated, and never lowered. The table is gamedata.ini's (GoodCommandPointsMP2 ...).
;   - OpenBFMESpellStoreMenu: the spell store menu per faction. The High Elves faction opens the mod's 20-spell menu, SpellStoreHighElves.apt;
;     every other faction opens 2.02's SpellStore.apt with 2.02's spell tree.
;   - OpenBFMELiveUnitHelp: a unit's help (a portrait's tooltip) shows its current weapon's damage with its leadership, level and buff bonuses, "Melee Damage"
;     or "Ranged Damage" with the attack range (TOOLTIP:OpenBFMEWeaponRange in lotr.str), a horde's from its soldiers, instead of DisplayMeleeDamage /
;     DisplayRangedDamage; a shown unit help updates every second. The damage is before the target's armour.
;   - OpenBFMEAggressiveInRangeOnly: these High Elves ranged units, in the Aggressive stance and holding a ranged weapon (a bow/sword toggle in sword mode
;     fights as before), pick by themselves only what their weapon reaches from where they stand, do not walk after a target they picked themselves (an
;     attack order still walks), and while hitting a building they picked themselves they take an enemy unit in reach, looked for once a second (an
;     ordered building is kept). The Aggressive bonuses are unchanged.
;   - OpenBFMEHordeReachByMembers: an archer horde stops walking at its target as soon as every one of its archers reaches it, instead of where its
;     rangefinder does (the data sets each rangefinder 100 under the bow). An archer left behind does not hold the horde back further than before.
;   - OpenBFMEForceKillReachesInert: Light of the Trees' sunbeams are INERT (nothing finds them: no damage, aura or script), yet WeatherKiller (another
;     weather spell, an enemy's Darkness ...) must end them with the spell. A DamageNugget whose ForceKillObjectFilter names them kills them; nothing
;     else reaches them.
;   - OpenBFMEValinorWeather: Light of the Trees sets the weather VALINOR instead of SUNNY (its ChangeWeather in highelves.ini, which the original
;     game reads): with the Enhanced look the view takes a warm light with drifting pools of gold and silver on the ground while it lasts. Cloud
;     Break and Sun Flare keep SUNNY. The game rules are the same as SUNNY's (no weather sound, the same buff, any weather spell ends it).
;   - OpenBFMEGarrisonLaunchFromSeat: the tree flet's archers shoot from where they sit in the canopy (its twelve ARROW_ points), each from its own,
;     instead of all from the building's first launch bone (a garrison's riders launch from the building in the original game).
;   - OpenBFMESplitShot (TEST): Legolas's extra arrows (level 3: two, level 7: three) each hit a different enemy near his target, searched within 30
;     at point-blank up to 90 at full range; with no other enemy only the first arrow flies (the original game fires them all at the target).
;   - OpenBFMEMapOverrideReplacesModules: in a map's map.ini a module re-declared with the object's own tag replaces it; 25 of 2.02's maps
;     (Bywater, the Tombs of Karna, ...) do that, which the original game refuses with a crash. Southfarthing also has a corrected map.ini.
;   - OpenBFMEFireWaitsForReload: Thranduil's Rampage bow shoots the moment its reload ends (every 3rd logic frame at its 0.6 s), instead of the
;     original game's next check two frames later (every 5th).
;   - OpenBFMEChainHordeMembers: Thranduil, attacking a horde's soldier, moves on to the next soldier in reach when it dies, instead of ending
;     the attack and looking again (about 1 kill a second against a horde before; 1.25 with Rampage).
;   - OpenBFMEAbilityRangeFollowsBonus (dj-dev): Legolas's, Thranduil's and Elrond's powers start from their StartAbilityRange times the hero's range bonus (the Bow and Swift Feet
;     items), as his weapons' reach does, so a range item lengthens his powers with his bow; the original game keeps the start range fixed.
;   - OpenBFMEArmory (dj-dev): the Armory overlay, opened from a button above the Palantir's Powers button, lists these heroes with their items
;     (the PLAYER_UPGRADE buttons of each command set, grouped into lines by NeededUpgrade). Each hero has a research queue of its own, run by
;     the game itself: no building, nothing waits behind the citadel's upgrades or hero recruits, usable from the start. The original game has no
;     such overlay.

GameData
  OpenBFMEAutoAcquireWithinWeaponRange = Yes
  OpenBFMETeamCommandPoints = Yes
  OpenBFMESpellStoreMenu = FactionHighElves SpellStoreHighElves
  OpenBFMELiveUnitHelp = Yes
  OpenBFMEForceKillReachesInert = LightOfTreesSunbeam
  OpenBFMEValinorWeather = SpellBookLightOfTrees
  OpenBFMEHordeReachByMembers = Yes
  OpenBFMEAggressiveInRangeOnly = HEElvenMirkwoodArcherHorde HEElvenLorienArcherHorde HENoldorWarriorHorde GaladhrimWarriorHorde HEElvenLegolas HERohanLegolas HEElvenHaldir HEElvenThranduil MirkwoodTauriel MirkwoodTauriel_WOTR NoldorArcherHorde ElvenRivendellArcherHorde HEElvenElrond CreateAHero
  OpenBFMEGarrisonLaunchFromSeat = TreeFlet
  OpenBFMESplitShot = HELegolasBow 30 90
  OpenBFMESplitShot = HEElvenThranduilBow 30 90
  OpenBFMESplitShot = HEThranduilRampageBow 30 90
  OpenBFMESplitShot = HEElvenLegolasBow 30 90
  OpenBFMESplitShot = HEElvenLegolasFanOfArrows 100 100
  OpenBFMEMapOverrideReplacesModules = Yes
  OpenBFMEFireWaitsForReload = HEThranduilRampageBow
  OpenBFMEChainHordeMembers = HEElvenThranduil
  OpenBFMEAbilityRangeFollowsBonus = HEElvenLegolas
  OpenBFMEAbilityRangeFollowsBonus = HEElvenThranduil
  OpenBFMEAbilityRangeFollowsBonus = HEElvenElrond
  OpenBFMEArmory = HEElvenThranduil HEArmoryThranduilCommandSet
  OpenBFMEArmory = HEElvenLegolas HEArmoryLegolasCommandSet
  OpenBFMEArmory = HEElvenElrond HEArmoryElrondCommandSet
End
