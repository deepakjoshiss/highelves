; OpenBFME's rules for this mod (openbfme-godot docs/MODS.md): OpenBFME reads this file after the game's INI; the original game never opens it,
; so the mod's 2.02 files stay loadable by it (an OpenBFME field in them would stop it, and OpenBFME refuses one there too).
;   - OpenBFMEAutoAcquireWithinWeaponRange: a unit that auto-acquires (AutoAcquireEnemiesWhenIdle Yes, not No) shoots, idle or guarding, what its current weapon
;     reaches from where it stands when that is farther than its vision, where its player sees it clear (heroes in the Hold Ground stance, the Create-a-Hero,
;     horse archers, ships ...). Units that wait for orders (No: the Mighty Catapult, the Vigilant Ent) keep waiting.
;     Garrisoned units keep their whole tower range (not capped by their vision), except in a hold stance (Hold Ground, Porcupine).
;   - OpenBFMETeamCommandPoints: in a skirmish or multiplayer game a player's command point cap is its team's share of the game's army (the table's cap of the
;     live player count x the live players, shared equally by the teams and within a team by its players), never below the table's cap, never above the
;     two-player cap; computed again whenever a player is defeated, and never lowered. The table is gamedata.ini's (GoodCommandPointsMP2 ...).
;   - OpenBFMESpellStoreMenu: the spell store menu per faction. The High Elves faction opens the mod's 20-spell menu, SpellStoreHighElves.apt;
;     every other faction opens 2.02's SpellStore.apt with 2.02's spell tree.
;   - OpenBFMELiveUnitHelp: a unit's help (a portrait's tooltip) shows its current weapon's damage with its leadership, level and buff bonuses, "Melee Damage"
;     or "Ranged Damage" with the attack range (TOOLTIP:OpenBFMEWeaponRange in lotr.str), a horde's from its soldiers, instead of DisplayMeleeDamage /
;     DisplayRangedDamage; a shown unit help updates every second. The damage is before the target's armour.
;   - OpenBFMEAggressiveInRangeOnly: these High Elves ranged units, in the Aggressive stance and holding a ranged weapon (a bow/sword toggle in sword mode
;     fights as before), pick by themselves only what their weapon reaches from where they stand, do not walk after a target they picked themselves (an
;     attack order still walks), and while hitting a building they picked themselves they take an enemy unit in reach, looked for once a second (an
;     ordered building is kept). The Aggressive bonuses are unchanged.

GameData
  OpenBFMEAutoAcquireWithinWeaponRange = Yes
  OpenBFMETeamCommandPoints = Yes
  OpenBFMESpellStoreMenu = FactionHighElves SpellStoreHighElves
  OpenBFMELiveUnitHelp = Yes
  OpenBFMEAggressiveInRangeOnly = HEElvenMirkwoodArcherHorde HEElvenLorienArcherHorde HENoldorWarriorHorde GaladhrimWarriorHorde HEElvenLegolas HERohanLegolas HEElvenHaldir HEElvenThranduil MirkwoodTauriel MirkwoodTauriel_WOTR NoldorArcherHorde ElvenRivendellArcherHorde HEElvenElrond CreateAHero
End
