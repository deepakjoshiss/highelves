; This file contains only objects that are of use to the game code from
; an engineering standpoint.  They are not general objects that a designer
; would place in a map.
;
; EVERYTHING in this file should use "EditorSorting = SYSTEM".
; If it doesn't, it shouldn't be in this file.
;
;//////////////////////////////////////////////////////////////////////////////

#define SPELL_BOOK_REQUIREMENTS_FILTER NONE +COMMANDCENTER
#define SPELL_BOOK_REQUIREMENTS_FILTER_STRATEGIC NONE
Object LuaEcoTicker ;,; added
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model = None
		End
	End

	KindOf = PRELOAD NOT_AUTOACQUIRABLE IGNORE_FOR_VICTORY UNATTACKABLE  ;,;
	Body = ActiveBody ModuleTag_MakesKillWork
		MaxHealth = 999999
	End

	Behavior = AIUpdateInterface ModuleTag_03
		AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS
		MoodAttackCheckRate        = 250 ;,; 
	End

	Behavior = AttributeModifierAuraUpdate ModuleTag_Tick ;;,;; 
        StartsActive    = Yes ;,; ;If no, requires upgrade to turn on.
        BonusName        = TockModifier
        RefreshDelay    = 2000
        Range            = 50 ;,; 
        TargetEnemy        = No  ;,; 
        ObjectFilter    = INDUSTRY_TYPE_SPELL_OBJECT_FILTER ;,; ANY +FS_CASH_PRODUCER ;,;
    End  	

	Behavior = SlavedUpdate ModuleTag_Slave
		LeashRange                                      = 0
		GuardMaxRange                                   = 0
		GuardWanderRange                                = 0
		AttackRange                                     = 0
		UseSlaverAsControlForEvaObjectSightedEvents     = No    // Not a creep          
		GuardPositionOffset                             = X:0 Y:0 Z:0
		DieOnMastersDeath                               = Yes   //Die when my master dies!
	End
End
Object PlayerNumberDetector ;,; added
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model = None
		End
	End

	KindOf = IMMOBILE UNATTACKABLE

	Body = ActiveBody ModuleTag_MakesKillWork
		MaxHealth = 1
	End

	Behavior = AIUpdateInterface ModuleTag_EventList
			AILuaEventsList = PlayerNumberDetectorFunctions
	End

	Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate
		MinLifetime		= 2000
		MaxLifetime		= 2000
		DeathType		= FADED
	End	

	Behavior = SlowDeathBehavior ModuleTag_DropTheIncomeTaper
        DestructionDelay = 1000
        OCL        = FINAL OCL_IncomeTaper
    End 
End
Object IncomeTaperDummy ;,; added
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model = None
		End
	End

	KindOf = IMMOBILE UNATTACKABLE

	Body = ActiveBody ModuleTag_MakesKillWork
		MaxHealth = 1
	End

End

