Object FortConstructionRefundShadow ;,;

    KindOf = PRELOAD STRUCTURE IMMOBILE NOT_AUTOACQUIRABLE IGNORE_FOR_VICTORY ;,;

    Body = ActiveBody ModuleTag_MakesKillWork
        MaxHealth = 99999
    End

    Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate
        MinLifetime        = 1000 ;,; 
        MaxLifetime        = 1000 ;,; 
        DeathType          = CRUSHED
    End

	Behavior = AutoDepositUpdate AutoDepositModuleTag
		DepositTiming       	= 600 ;,; 
		DepositAmount       	= MEN_FORTRESS_BUILDCOST  ;,; 
	End

    Behavior = AttributeModifierUpgrade ModuleTag_ElvenGiftBonus
	    TriggeredBy 			= Upgrade_MordorFaction Upgrade_WildFaction Upgrade_AngmarFaction Upgrade_ArnorFaction Upgrade_IsengardFaction Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction
		AttributeModifier       = RefundPercentageModifier
	End
	
	Behavior = SlowDeathBehavior ModuleTag_Die
    End
End
