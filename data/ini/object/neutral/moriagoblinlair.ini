  Draw = W3DScriptedModelDraw ModuleTag_01
    DefaultModelConditionState
      Model = NBGoblinLair
    End
		ModelConditionState = SNOW ;,;
			Model			= NBGoblinLair
			Texture			= NBGoblinLair.tga NBGoblinLair_snow.tga
		End
  End
	Draw = W3DFloorDraw ModuleTag_DrawFloor    
		StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
		ModelName = NBGobLair_Bib
		WeatherTexture		= SNOWY NBGoblinLairBib_Snow.tga
	End

	VisionRange 		= 0
	ShroudClearingRange 	= 0
	KindOf =  PRELOAD STRUCTURE SELECTABLE IMMOBILE  NEED_BASE_FOUNDATION MADE_OF_STONE CAN_SEE_THROUGH_STRUCTURE IGNORE_FOR_VICTORY   FS_FACTORY NOT_AUTOACQUIRABLE NEVER_CULL_FOR_MP NOT_SELLABLE
	
