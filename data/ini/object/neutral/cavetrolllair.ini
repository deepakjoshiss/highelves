    End
  End

	KindOf				= SELECTABLE IMMOBILE NOT_AUTOACQUIRABLE UNATTACKABLE REVEAL_TO_ALL	CRATE ONE_RING
	ShroudClearingRange	= 0

	Body = StructureBody ModuleTag_05
		MaxHealth				= 999999
	End
	Behavior = CreateObjectDie ModuleTag_06
		DeathTypes = ALL
		CreationList = OCL_CaveTrollLairRealShadowInFog
	End
	Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate	
		MinLifetime		= 0
		MaxLifetime		= 0
	End
	Behavior = SlowDeathBehavior ModuleTag_Fading
		DeathTypes			= ALL
		FadeDelay			= 0
		FadeTime			= 0
		DestructionDelay	= 0
	End
End
Object CaveTrollLairRealShadowInFog ;,;
  Draw = W3DScriptedModelDraw ModuleTag_01
    DefaultModelConditionState
      Model = NBTrollLair
    End
		ModelConditionState = SNOW ;,;
			Model			= NBTrollLair
			Texture			= NBTrollLair.tga NBTrollLair_snow.tga
		End
  End
	Draw = W3DFloorDraw ModuleTag_DrawFloor    
		StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
