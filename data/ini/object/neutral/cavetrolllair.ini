
;------------------------------------------------------------------------------
;
Object CaveTrollLair

	SelectPortrait = BPCTrollLair
 
	; *** ART Parameters ***
	Draw = W3DScriptedModelDraw ModuleTag_Draw
	
		DefaultModelConditionState
			Model = NBTrollLair
		End

		ModelConditionState  = JUST_BUILT
			Model            = NBTrollLair_A
			;  Texture            = NBWargLair.tga NBWargLair_snow.tga
		End

		AnimationState            = JUST_BUILT
			Animation
				AnimationName        = NBTrollLair_A.NBTrollLair_A
				AnimationMode        = ONCE
				AnimationBlendTime    = 0
				AnimationSpeedFactorRange = 17 17
			End
		End 

		;-- building being constructed
		ModelConditionState = AWAITING_CONSTRUCTION SNOW 
			Model			= NBTrollLair_A
			Texture			= NBTrollLair.tga NBTrollLair_snow.tga
		End
    	ModelConditionState   = AWAITING_CONSTRUCTION 
      		Model               = NBTrollLair_A
    	End
    	AnimationState        = AWAITING_CONSTRUCTION
      		Animation           = NBTrollLair_A
        		AnimationName     = NBTrollLair_A.NBTrollLair_A
        		AnimationMode     = MANUAL
      		End
	  		Flags				  = START_FRAME_FIRST
    	End

		ModelConditionState = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED SNOW 
			Model			= NBTrollLair_A
			Texture			= NBTrollLair.tga NBTrollLair_snow.tga
		End
    	ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      	Model               = NBTrollLair_A
			;ParticleSysBone   = DUSTBONE BuildingContructDust
    	End
    	AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      		Animation           = NBTrollLair_A
        		AnimationName     = NBTrollLair_A.NBTrollLair_A
        		AnimationMode     = MANUAL
      		End
			Flags				= START_FRAME_FIRST
			StateName			= BeingConstructed  
	    End

		;--damaged building
	  
		ModelConditionState  = DAMAGED
			Model         = NBTrollLair_D1  
		End
		AnimationState = DAMAGED
			EnteringStateFX	= FX_BuildingDamaged
		End	    
		
		ModelConditionState  = REALLYDAMAGED
			Model         = NBTrollLair_D2
		End
	    
	    AnimationState = REALLYDAMAGED
      		Animation				=	RubbleAnimation
				AnimationName		=	 NBTrollLair_D2.NBTrollLair_D2
				AnimationMode		=	ONCE
  			End
		    EnteringStateFX	= FX_BuildingReallyDamaged
		End
 
		ModelConditionState  = COLLAPSING
			Model         = NBTrollLair_D3
		End
		
		AnimationState = COLLAPSING
      		Animation				=	RubbleAnimation
				AnimationName		=	 NBTrollLair_D3.NBTrollLair_D3
				AnimationMode		=	ONCE
  			End
  			EnteringStateFX	= FX_StructureMediumCollapse
		End

		ModelConditionState  = RUBBLE
			Model         = None  
		End  
		
		ModelConditionState  = POST_RUBBLE
			Model         = NONE
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
		
		AnimationState = POST_RUBBLE
		End

		ModelConditionState  = POST_COLLAPSE
		Model         = None
			ParticleSysBone NONE SmokeBuildingMediumRubble
		End
		
		AnimationState = POST_COLLAPSE
		End 

		ModelConditionState = SNOW 
			Model			= NBTrollLair
			Texture			= NBTrollLair.tga NBTrollLair_snow.tga
		End
	        	
	End

	Draw = W3DFloorDraw ModuleTag_DrawFloor    
		StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
		ModelName = NBTrollL_Bib
		WeatherTexture		= SNOWY NBTrollLairBib_snow.tga
	End
  	
	Draw = W3DScriptedModelDraw UntamedAllegianceFX
	    DefaultModelConditionState
	      Model = None
	    End
		AnimationState = USER_2
			ParticleSysBone = None UntamedAllegiance HouseColor:Yes
			ParticleSysBone	= None UntamedAllegiance2 HouseColor:Yes
		End
	End

	CommandSet   =   EmptyCommandSet

	; ***DESIGN parameters ***
	DisplayName			= OBJECT:CaveTrollLair
	Description			= OBJECT:CaveTrollLairDescription
	Side				= Neutral
	IsTrainable			= No
	EditorSorting		= STRUCTURE
	ThreatLevel			= 1.0
	PlacementViewAngle	= 90	
	BuildTime			= 30
	VisionRange         = MORDOR_ORCPIT_VISION_RANGE
	ShroudClearingRange = MORDOR_ORCPIT_SHROUD_CLEAR

	ArmorSet
		Conditions		= None
		Armor			= MonsterLair
	End


	; *** AUDIO Parameters ***

	VoiceSelect         		= CreepBuildingGenericSelect	;MordorTrollCageSelect			;MordorOrcPitSelect

	;SoundAmbient        	= MordorOrcPitAmbience
	SoundOnDamaged			= BuildingLightDamageStone
	SoundOnReallyDamaged	= BuildingHeavyDamageStone

 
	; *** ENGINEERING Parameters ***
	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE IMMOBILE SELECTABLE SCORE AUTO_RALLYPOINT IGNORE_FOR_VICTORY FS_FACTORY CHUNK_VENDOR ;,; Added CHUNK_VENDOR;,; Added FS_FACTORY
 
	Body						= ActiveBody ModuleTag_Body
		MaxHealth				= 2000
		MaxHealthDamaged		= 1000
		MaxHealthReallyDamaged	= 500
		
		    GrabObject = EntThrownBuildingRock ;,;
    GrabFX = FX_WallGrab ;,;
    GrabDamage = ROHAN_TREEBEARD_CHUNK_GRAB_DAMAGE ;,;
    GrabOffset = X:16 Y:0 ;,;
	End
	
	Behavior = GettingBuiltBehavior ModuleTag_04
		RebuildWhenDead				= Yes
		SelfBuildingLoop			= BuildingConstructionLoop ; Only played if we DON'T spawn a worker
		SelfRepairFromDamageLoop	= NoSound         ; This doesn't cause an animation, so don't bother playing a sound
		SelfRepairFromRubbleLoop	= BuildingConstructionLoop
		DisallowRebuildRange		= 300
		DisallowRebuildFilter		= ANY +STRUCTURE
		UseSpawnTimerWithoutWorker	= Yes
		SpawnTimer			= 300
	End

	Behavior = SpawnBehavior ModuleTag_Spawn
		SpawnNumber				= 1
		InitialBurst			= 1
		SpawnTemplateName		= CaveTroll_Slaved
		SpawnReplaceDelay		= 120000
		CanReclaimOrphans		= Yes
	End

	Behavior = KeepObjectDie ModuleTag_IWantRubble
	End
	
	Behavior = StructureCollapseUpdate ModuleTag_Collapse
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapse
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight			= 120
	End

	Behavior = RebuildHoleExposeDie ModuleTag_ExposeDie
		ExemptStatus		= SOLD
		HoleName			= CaveTrollLairHole
		HoleMaxHealth		= 500.0
		FadeInTimeSeconds	= 2.0
		TransferAttackers	= No
	End

	Behavior = CommandSetUpgrade ModueTag_FactionCommandSet
		TriggeredBy				= Upgrade_AngmarFaction Upgrade_IsengardFaction Upgrade_MordorFaction Upgrade_WildFaction Upgrade_MenFaction Upgrade_ElfFaction Upgrade_DwarfFaction
		CommandSet				= NeutralTrollCaveCommandSet
		CustomAnimAndDuration	= AnimState:USER_2 AnimTime:0
	End
	
;,; ==================================== UA spawn modules ========================================= ;,; 
	Behavior = GrantUpgradeCreate ModuleTag_GH23 ;;,;; Do not auto recruit by default
        UpgradeToGrant        = Upgrade_PreventSpawning ;,; 
        GiveOnBuildComplete = Yes ;// The ExemptStatus UnderConstruction hack doesn't work on foundation buildings.
    End

    Behavior = DoCommandUpgrade Module_AutoRecruit ;,; but only if the troll is dead  
        TriggeredBy                = Upgrade_UARebuild_and_Recruit ;,;
		ConflictsWith			   = Upgrade_PreventSpawning ;,; available by default, but is removed when the slaved troll is dead thus stopping USER_3 condition that keeps the upgrade alive  ;,; 
        GetUpgradeCommandButtonName = Command_ConstructGoblinTrollFromDefectedLair_Slaved ;,; 0 CP ;,; 
    End

    Behavior = AttributeModifierUpgrade ModuleTag_BuildInstantly 
        TriggeredBy =  Upgrade_UARebuild_and_Recruit
		;,; ConflictsWith			   = Upgrade_PreventSpawning ;,; not necessary since DoCommandUpgrade is not triggered when this upgrade is present ;,; 
        AttributeModifier = SpellBookUAInstantUnit ;,; increases the speed of production
        CustomAnimAndDuration   = AnimState:USER_6 AnimTime:350 TriggerTime:0 ;,; this is what removes Upgrade_UARebuild_and_Recruit  in 350ms so that when another players recaptures the lair DoCommandUpgrade is triggered again ;,; 
    End

    Behavior = AIUpdateInterface ModuleTag_SoWeCanSpawnThings
         AutoAcquireEnemiesWhenIdle    = No ;,; 
         MoodAttackCheckRate        = 250
        AILuaEventsList                = UACreepStructureFunctions ;;.;; Added
     End


	Behavior = ProductionUpdate ProductionUpdateModuleTag
	     ProductionModifier        ; An object-local discount.  
            RequiredUpgrade =  Upgrade_UARebuild_and_Recruit
            CostMultiplier = 0 ;,; makes the unit free ;,; 
            ModifierFilter = NONE +MONSTER
        End
	;,; ==================================== UA spawn modules end ==================================== ;,; 	
		NumDoorAnimations            = 1 ;,; 0
		DoorOpeningTime              = 750 ;,; 3250  ;in mSeconds how long you want doors to be in open state
		DoorWaitOpenTime             = 100 ;,; 2000  ;in mSeconds time the door stays open, so units can exit
		DoorCloseTime                = 100 ;,; 4000  ;in mSeconds how long you want doors to be in open state
		ConstructionCompleteDuration = 1000 ;,; 1500  ;in mSeconds   wait time so if you have multiple units they don't run over each other
	End
	
	Behavior = QueueProductionExitUpdate ModuleTag_Exit
		PlacementViewAngle	= -90
		UnitCreatePoint		= X:0.0 Y:-20.0 Z:0.0
		NaturalRallyPoint	= X:0.0 Y:-93.0 Z:0.0	;NaturalRallyPointX must always match GeometryMajorRadius! 
	End  

	Behavior = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius			= TERRAIN_CLAIM_RADIUS ;,; 80		;// How far we try to claim ground
		MaxIncome		= 0			;// If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval	= 999999	;// How often (in msec) we give that much money
		HighPriority	= Yes		;// A high priority claim gets to pretend it was there first.
	End
	
	Behavior = ObjectCreationUpgrade ModuleTag_TheObjectCreationUpgrade ;,;
        TriggeredBy          = Upgrade_CreepShadowInFog
        ThingToSpawn    = CaveTrollLairShadowInFog
    End

	Behavior = SpecialEnemySenseUpdate ModuleTag_AutoTargettingHack ;;,;;
		SpecialEnemyFilter = ALL -STRUCTURE -PORTER
		ScanRange = 150 ;,; VISION_HERO_STANDARD
		ScanInterval = 0 ;,; 1000 ;,; 1000 ;,; 
	End	

	Behavior = PassiveAreaEffectBehavior ModuleTag_ConsiderReturning
	    UpgradeRequired         = Upgrade_MiniHordeLvl2
		EffectRadius			= 320 ;,; 
		PingDelay				= 4000
		ModifierName			= GetTrollToConsiderReturning
		AllowFilter				= NONE +CaveTroll_Slaved ;,; 
	End

	Behavior = PassiveAreaEffectBehavior ModuleTag_PreventConsideration
		EffectRadius			= 100 ;,; 
		PingDelay				= 500
		ModifierName			= TrollPreventConsideration
		AllowFilter				= NONE +CaveTroll_Slaved ;,; 
	End

	Behavior = PassiveAreaEffectBehavior ModuleTag_HealTrolls	;,;
		EffectRadius = 100 ;,; 200
		PingDelay		= 2000 ;,;
		HealPercentPerSecond	= 0.5% ;,; 3% ;,; 1% 
		AllowFilter		= NONE +TROLL ;,; 
		NonStackable	= No ;,;
		HealFX		= FX_SpellHealUnitHealBuff
	End

	Geometry			= CYLINDER
	GeometryMajorRadius	= 46.0
	GeometryMinorRadius	= 46.0
	GeometryHeight		= 57.0
	GeometryIsSmall		= No
	GeometryOffset			= X:0.8 Y:-6.5 Z:0
	
	GeometryContactPoint = X: 15 Y: 15 Z:20 Swoop
	GeometryContactPoint = X:-15 Y:-15 Z:20 Swoop
	GeometryContactPoint = X:-15 Y: 15 Z:20 Swoop
	GeometryContactPoint = X: 15 Y:-15 Z:20 Swoop
	
	Shadow				= SHADOW_DECAL
	BuildCompletion		= PLACED_BY_PLAYER
End


;------------------------------------------------------------------------------

ChildObject CaveTrollLairSnow CaveTrollLair

End
ChildObject UACaveTrollLair CaveTrollLair
	Side				= Civilian ;,;
	EditorSorting		= NONE ;,;

    Behavior = SpawnBehavior ModuleTag_Spawn
        SpawnNumber                = 0
        InitialBurst            = 0
        SpawnTemplateName        = CaveTroll_Slaved
        SpawnReplaceDelay        = 9999999
        CanReclaimOrphans        = Yes
    End

	Behavior = GrantUpgradeCreate ModuleTag_GH23 ;;,;; spawn the troll and stop the prevention upgrade from showing up
        UpgradeToGrant        = Upgrade_UARebuild_and_Recruit ;,; 
        GiveOnBuildComplete = Yes ;// The ExemptStatus UnderConstruction hack doesn't work on foundation buildings.
    End

	Behavior = RebuildHoleExposeDie ModuleTag_ExposeDie
		ExemptStatus		= SOLD
		HoleName			= UACaveTrollLairHole
		HoleMaxHealth		= 500.0
		FadeInTimeSeconds	= 2.0
		TransferAttackers	= No
	End
End
