Object MirkBridgeReal
  Draw = W3DScriptedModelDraw ModuleTag_Draw
    DefaultModelConditionState
      Model = NBMirkBridge
    End
		ModelConditionState  = COLLAPSING
			Model         = NBMirkBridge_D3
				Texture	= nbbridgea.tga nbbridgea_rd.tga
				Texture	= nbbridgeb.tga nbbridgeb_rd.tga
		End	
		AnimationState = COLLAPSING
      		Animation				=	RubbleAnimation
				AnimationName		=	 NBMirkBridge_D3.NBMirkBridge_D3
				AnimationMode		=	ONCE
				AnimationSpeedFactorRange = 1.25 1.25
  			End
		End
	ModelConditionState  = RUBBLE
		Model         = NBMirkBridge_D3
				Texture	= nbbridgea.tga nbbridgea_rd.tga
				Texture	= nbbridgeb.tga nbbridgeb_rd.tga
	End
	AnimationState = RUBBLE
	      		Animation				=	RubbleAnimation
				AnimationName		=	 NBMirkBridge_D3.NBMirkBridge_D3
				AnimationMode		=	ONCE
  			End
	End
    ModelConditionState = REALLYDAMAGED
				Texture	= nbbridgea.tga nbbridgea_rd.tga
				Texture	= nbbridgeb.tga nbbridgeb_rd.tga
    End
End

  PlacementViewAngle  = 0
  DisplayName         = OBJECT:MirkBridge
  Description 	      = OBJECT:MirkBridgeDescription

  Side                = Civilian
  EditorSorting       = NONE
  ThreatLevel = 1.0
  
  ArmorSet
    Conditions        = None
    Armor             = BridgeArmor
  End

	; *** ENGINEERING Parameters ***
	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE  NEED_BASE_FOUNDATION LINKED_TO_FLAG  FS_FACTORY  CAN_CAST_REFLECTIONS NOT_AUTOACQUIRABLE NEVER_CULL_FOR_MP NOT_SELLABLE
	KeepSelectableWhenDead = Yes
	
	Body                        = StructureBody ModuleTag_05
		MaxHealth         		    = 10000
		MaxHealthReallyDamaged 		= 5000
	End
	Behavior = KeepObjectDie ModuleTag_IWantRubble
	End
  	Behavior = SlowDeathBehavior ModuleTag_Death
		DeathTypes = ALL 
		SinkDelay = 3000
		SinkRate = 0.00     ; in Dist/Sec
		DestructionDelay = 3100
		FX = INITIAL FX_StructureMediumCollapse
	End
	Behavior = CreateObjectDie ModuleTag_MirkBridgeShadowEgg
		DeathTypes = ALL  
		CreationList = OCL_MirkBridgeRealDestroyed
	End

	Geometry				= BOX
  	GeometryMajorRadius		= 100.0
	GeometryMinorRadius		= 60.0
	GeometryHeight			= 25.0			
	GeometryIsSmall			= No
	Shadow					= SHADOW_VOLUME
End

ChildObject MirkBridge MirkBridgeReal	
RemoveModule ModuleTag_Death
RemoveModule ModuleTag_MirkBridgeShadowEgg
  	Side                = Neutral
  	EditorSorting       = STRUCTURE
  	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE NEED_BASE_FOUNDATION  FS_FACTORY  CAN_CAST_REFLECTIONS LINKED_TO_FLAG NOT_AUTOACQUIRABLE NEVER_CULL_FOR_MP NOT_SELLABLE
  
  	Behavior                  = StructureCollapseUpdate ModuleTag_08
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		DestroyObjectWhenDone	= No
		CollapseHeight			= 125
  	End
	Behavior = CreateObjectDie ModuleTag_MirkBridgeReal
		DeathTypes = ALL  
		CreationList = OCL_MirkBridgeReal ;OCL_MirkBridgeEgg
	End
	Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate	
		MinLifetime		= 0
		MaxLifetime		= 0
	End
End

