  End
  
  

  PlacementViewAngle  = -45
 
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:SignalFire
  Description 	      = OBJECT:SignalFireDescription
  
  Side                = Neutral
  EditorSorting       = STRUCTURE
  ThreatLevel		  = 1.0
 
  CommandSet          = GenericSelfRepairCommandSet
  BuildCost           = 0 ;,;500
  BuildTime           = 45
  BountyValue         = 50
  VisionRange         = 750.0 ;,; 160.0
  ShroudClearingRange = 750.0 ;,; 160.0

  ArmorSet
    Conditions        = None
    Armor             = StructureArmor ;,; InvulnerableArmor ;,; StructureArmor
  End


  ; *** AUDIO Parameters ***
	#include "..\Includes\StandardBuildingEvaEvents.inc"

	VoiceSelect		= CivilianSignalFireSelect

	;SoundAmbient	= SignalFireAmbientLoop		;plays even when there's no fire (hasn't been captured)

	SoundOnDamaged		= BuildingLightDamageStone
	SoundOnReallyDamaged	= BuildingHeavyDamageStone

;	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction

	UnitSpecificSounds
		UnderConstruction		= BuildingConstructionLoop  ; Built first time
		; UnderRepairFromDamage	= NoSound					; Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble	= BuildingConstructionLoop	; Repaired from completely destroyed (not used???)
	End

	ClientBehavior = ModelConditionAudioLoopClientBehavior ModuleTag_foo
		ModelCondition = Required:CAPTURED	Excluded:RUBBLE COLLAPSING	Sound:SignalFireAmbientLoop
	End

	CampnessValue = CAMPNESS_TECH_BUILDING

	; Event to play when first seen. Same event regardless of owner
	EvaOnFirstSightingEventEnemy = SawSignalFire
	EvaOnFirstSightingEventNonEnemy = SawSignalFire
   	EvaEnemyObjectSightedEvent	= None   ; Don't do this, covered by "OnFirstSighting"

	; *** ENGINEERING Parameters ***

	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE IMMOBILE NOT_AUTOACQUIRABLE LINKED_TO_FLAG NEVER_CULL_FOR_MP NOT_SELLABLE SELECTABLE CHUNK_VENDOR ;,; Added CHUNK_VENDOR
	;,;KeepSelectableWhenDead	= Yes
	
	Behavior = SlowDeathBehavior ModuleTag_DeathBehavior ;,;
		DeathTypes		= ALL 
		SinkDelay		= 2000
		SinkRate		= 0.1     ; in Dist/Sec
		DestructionDelay	= 2000
		OCL = INITIAL OCL_SignalFireFoundation
	End
	
	 Flammability ;,;FakeFlameModule
	   Fuel		             = FAKE_FIRE_FUEL
	   MaxBurnRate	 = FAKE_FIRE_MAX_BURN_RATE
	   Decay		         = FAKE_FIRE_DECAY
	   Resistance	     = FAKE_FIRE_RESISTANCE
	End

	Body = StructureBody ModuleTag_Body
		MaxHealth = 7500 ;;,;; 1000
		
		    GrabObject = EntThrownBuildingRock ;,;
    GrabFX = FX_WallGrab ;,;
    GrabDamage = ROHAN_TREEBEARD_CHUNK_GRAB_DAMAGE ;,;
    GrabOffset = X:16 Y:0 ;,;

	End

	Behavior = GettingBuiltBehavior GetBuiltBehaviorTag
		SelfBuildingLoop			= BuildingBigConstructionLoop			; Only played if we DON'T spawn a worker
		SelfRepairFromDamageLoop	= NoSound					; This doesn't cause an animation, so don't bother playing a sound
		SelfRepairFromRubbleLoop	= BuildingBigConstructionLoop
		SpawnTimer					= -1.0
		RebuildTimeSeconds			= 40
	End
	
	; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are 
	; never truly destroyed, even when reduced to zero health. Also note that garrisonable
	; buildings automatically stick around because GarrisonContain has it's own DieModule
	Behavior = KeepObjectDie ModuleTag_IWantRubble
		StayOnRadar				= Yes
	End
  
;,;	Behavior					= SpellRechargeModifierUpgrade ModuleTag_MakeSpellsRefreshFaster ;,; Removed owing to bug associated with capture.
;,;		LabelForPalantirString	= GUI:SpellBookRefreshReduction
;,;		StartsActive			= Yes
;,;		Percentage				= -25%
;,;		Percentage				= -45% ;,; -44% ;;,;; -50%
;,;		Percentage				= -55% ;,; -58% ;;,;;
;,;		Percentage				= -60% ;,;
;,;	End
	
	Behavior                  = BuildingBehavior BuildingModuleTag
	; NightWindowName			= GBWORKSHOPN
	; FireWindowName			= WINDOW_F01
	; GlowWindowName			= WINDOW_G01
	; FireName					= FIRE01
	End
	
	Behavior = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius			= TERRAIN_CLAIM_RADIUS ;,; 80		;// How far we try to claim ground
		MaxIncome		= 0			;// If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval	= 999999	;// How often (in msec) we give that much money
		HighPriority	= Yes		;// A high priority claim gets to pretend it was there first.
	End
	
	Geometry				= CYLINDER
  	GeometryMajorRadius		= 40.0
	GeometryMinorRadius		= 40.5
	GeometryHeight			= 30
	GeometryOffset			= X:1 Y:-4 Z:0

	AdditionalGeometry		= BOX
  	GeometryMajorRadius		= 15.0
	GeometryMinorRadius		= 15.0
	GeometryHeight			= 127
	GeometryOffset			= X:0 Y:0 Z:0

	AdditionalGeometry		= CYLINDER
  	GeometryMajorRadius		= 28.0
	GeometryMinorRadius		= 28.0
	GeometryHeight			= 85
	GeometryOffset			= X:2.2 Y:-3 Z:0
	
	GeometryIsSmall			= No
	Shadow					= SHADOW_VOLUME
	BuildCompletion			= PLACED_BY_PLAYER
	
	GeometryContactPoint = X:-15.0	Y:15.0		Z:0			Repair
	GeometryContactPoint = X:15.0	Y:-15.0		Z:0			Repair
	GeometryContactPoint = X:15.0	Y:15.0		Z:0
	GeometryContactPoint = X:-15.0	Y:-15.0		Z:0
	GeometryContactPoint = X:0.0	Y:0.0		Z:50.0	Swoop
End
