	End
	Flammability ;,;FakeFlameModule
		Fuel		             = FAKE_FIRE_FUEL
		MaxBurnRate	 = FAKE_FIRE_MAX_BURN_RATE
		Decay		         = FAKE_FIRE_DECAY
		Resistance	     = FAKE_FIRE_RESISTANCE
	End
 
	Geometry				= BOX
    GeometryName			= Geom_Main
  	GeometryMajorRadius		= 80.0
	GeometryMinorRadius		= 45.0
	GeometryHeight			= 20.0
	GeometryOffset			= X:-17 Y:0 Z:0	
	GeometryIsSmall			= Yes
	
	Shadow					= SHADOW_VOLUME
	BuildCompletion			= PLACED_BY_PLAYER
End
Object ShipwrightFoundationShadow ;,;
	ArmorSet
		Conditions        = None
		Armor             = NeutralStructureFoundationArmor
	End
	KindOf = BASE_FOUNDATION NO_COLLIDE BOAT NOT_AUTOACQUIRABLE WALL_UPGRADE

	Behavior = CastleMemberBehavior ModuleTag_CMB
	End
	Behavior = FoundationAIUpdate ModuleTag_FoundationAI
	End
	Body                = ActiveBody ModuleTag_05
		MaxHealth         = 1000000.0
	End
