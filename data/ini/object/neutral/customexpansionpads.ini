;====================================================================
Object CustomExpansionPadCornerRange
	SelectPortrait = BPGFortress_BuildPlot
	Draw = W3DFloorDraw DrawFloorBase  
		ModelName = GBFoundationB
	End
	Draw = W3DScriptedModelDraw ModuleTag_DrawMain
		DefaultModelConditionState
			Model = WBFoundationP
		End
		ModelConditionState = CONSTRUCTION_COMPLETE ;Remove the buildplot when it's been constructed on
			Model = None
		End	
	End

	DisplayName   = OBJECT:MenBuildingFoundation
	Description 	    = OBJECT:MenFortressDescription	
	Side                = CustomMapsStuff
	EditorSorting       = STRUCTURE
	ThreatLevel			= 1.0

	BuildCost           = 1
	BuildTime           = 5.0
	VisionRange         = 0.0
	ShroudClearingRange = 0
	
	CommandSet = CustomExpansionPadCornerRangeCommandSet

	VoiceSelect = Gui_PlotSelect

	KindOf = STRUCTURE SELECTABLE IMMOBILE BASE_FOUNDATION UNATTACKABLE NO_COLLIDE DO_NOT_CLASSIFY CAN_CAST_REFLECTIONS EXPANSION_PAD

	Behavior            = FoundationAIUpdate ModuleTag_foundationAI
		BuildVariation = 2 // Will give BUILD_VARIATION_TWO to anything built on it
	End

	Behavior = CastleMemberBehavior ModuleTag_CMB
	End

	Body                = ImmortalBody ModuleTag_05
		MaxHealth         = 15000.0
	End

	Geometry              = CYLINDER
	GeometryMajorRadius   = 10.0
	GeometryHeight        = 0.8
	GeometryIsSmall       = Yes
	Shadow                = SHADOW_VOLUME
	BuildCompletion		= PLACED_BY_PLAYER
End

ChildObject CustomExpansionPadCornerMelee CustomExpansionPadCornerRange
CommandSet = CustomExpansionPadCornerMeleeCommandSet
End
;====================================================================