	Geometry				= BOX
    GeometryName			= Geom_Orig
  	GeometryMajorRadius		= 67.5
	GeometryMinorRadius		= 50.0
	GeometryHeight			= 68
	GeometryOffset			= X:4.3 Y:13 Z:0	
		
	AdditionalGeometry		= CYLINDER
	GeometryName			= Geom_Orig
	GeometryMajorRadius		= 15.3
	GeometryMinorRadius		= 15.3
