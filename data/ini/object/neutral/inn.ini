ChildObject InnSecond Inn ;,;
  Side                = Civilian
  EditorSorting       = NONE

  KindOf = +IGNORE_FOR_VICTORY

	Behavior = AIUpdateInterface ModuleTag_03
		AILuaEventsList		= NeutralStructureFunctions
	End
;,;===========================================================================;,;
    Behavior = ObjectCreationUpgrade ModuleTag_MakeEligibleForRefund ;,;
        TriggeredBy             = Upgrade_MordorFaction Upgrade_WildFaction Upgrade_AngmarFaction Upgrade_ArnorFaction Upgrade_IsengardFaction Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction
        Delay                   = 0.0
        GrantUpgrade            = Upgrade_ObjectLevel10 
    End
    Behavior = ObjectCreationUpgrade ModuleTag_MakeIneligibleForRefund ;,;
        TriggeredBy             = Upgrade_MordorFaction Upgrade_WildFaction Upgrade_AngmarFaction Upgrade_ArnorFaction Upgrade_IsengardFaction Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction
        Delay                   = 50000.0
        RemoveUpgrade           = Upgrade_ObjectLevel10 
    End
;,;-----------------------------------------------------------------------------------------------------------;,;
    Behavior           = CreateObjectDie ModuleTag_SpawnRefundObject ;,; 
        ExemptStatus   = SOLD 
        RequiredStatus   = BUILD_BEING_CANCELED 
        CreationList   = OCL_SpawnUniqueExpansionRefund_2
        DeathTypes   = NONE +NORMAL
        ;MinKillerAngle   = 0 ;,; required not to spawn OCL when we cancel construction
        ;MaxKillerAngle   = 360 ;,; required not to spawn OCL when we cancel construction
        UpgradeRequired   = Upgrade_ObjectLevel10
    End
;,;===========================================================================;,;
	Behavior = SlowDeathBehavior ModuleTag_DeathBehavior
		DeathTypes		= ALL 
		SinkDelay		= 1500
		SinkRate		= 0.1     ; in Dist/Sec
		DestructionDelay	= 1500
		OCL = INITIAL OCL_InnFoundation
	End
	Behavior = DoCommandUpgrade Module_DeleteStructure ;,;	
		TriggeredBy = Upgrade_GenericObjectType_2
		GetUpgradeCommandButtonName = Command_SpecialAbilityDeleteStructure
	End
	Behavior = SpecialPowerModule ModuleTag_DeleteStructureStarter       
		SpecialPowerTemplate      = SpecialAbilityDeleteStructure
		UpdateModuleStartsAttack  = Yes
		StartsPaused		  	  = No
	End
	Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_DeleteStructureUpdate   
		SpecialPowerTemplate    = SpecialAbilityDeleteStructure
		SkipContinue			= Yes
		UnpackTime              = 10000 
		PackTime                = 1	
		AwardXPForTriggering    = 0		
		StartAbilityRange		= 0.0
		SpecialWeapon			= DeleteNeutralStructure
	End
	Behavior = CastleMemberBehavior ModuleTag_CMB
	End
	Behavior = FireWeaponUpdate ModuleTag_KillNeutralBuildingFoundation ;,;
        FireWeaponNugget
            WeaponName    = KillNeutralBuildingFoundation
            FireDelay    = 0
            OneShot        = Yes
	End
