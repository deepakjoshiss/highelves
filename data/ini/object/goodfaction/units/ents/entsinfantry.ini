;------------------------------------------------------------------------------
;Creating this Ent will randomize between several variations of the Ent (Fir, Birch)
;Eventually Ash will be supported.
;------------------------------------------------------------------------------
Object RohanGenericEnt
	ButtonImage		= WOR_Ent
	Draw = W3DScriptedModelDraw ModuleTag_01  
		StaticModelLODMode = Yes
		DefaultModelConditionState
			;Give it a model so it'll show up in WB
			Model               = RUTreeberd_SKN
			Skeleton            = RUTreeberd_SKL
		End
	End

	;***** IMPORTANT NOTE! ***************************************************************	
	;Certain Upgrades and costs may need to be propagated from here. One example was veterancy
	;overlays. See Zero Hour GLAVehicleTechnical for reference.
	;*************************************************************************************	

	; ***DESIGN parameters ***
	Side = Elves
	EditorSorting = UNIT
	CommandSet = RohanGenericEntCommandSet
	CommandPoints = ROHAN_ENT_COMMANDPOINTS ;,; 40 ;;,;; 50
	BuildVariations = RohanEntFir RohanEntBirch RohanEntOak ;,; RohanEntAsh ;,; Added RohanEntAsh and RohanEntOak ; Pending some Ash specific art bug resolution ;RohanEntAsh
	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS MONSTER SCORE CAN_ATTACK_WALLS HEAVY_MELEE_HITTER ARMY_SUMMARY SIEGEENGINE PATH_THROUGH_EACH_OTHER CAN_ATTACK SCARY ;,;removed PATH_THROUGH_INFANTRY ;,; Added back SCARY ;,; Added PATH_THROUGH_EACH_OTHER PATH_THROUGH_INFANTRY ;;,;; removed SCARY ATTACK_NEEDS_LINE_OF_SIGHT
	BuildCost = ROHAN_ENT_BUILDCOST				
	BuildTime = ROHAN_ENT_BUILDTIME
	BountyValue = ROHAN_ENT_BOUNTY_VALUE	
	
	Description = TOOLTIP:Ent ;,;
	DescriptionStrategic = CONTROLBAR:LW_ToolTipBuild_ElvenEnt ;,;

    			
	; *** AUTO RESOLVE DATA *** 
	AutoResolveUnitType     = AutoResolveUnit_Siege
	AutoResolveCombatChain  = AutoResolve_SiegeCombatChain
	AutoResolveBody         = AutoResolve_ElvenEntBody
	
	AutoResolveArmor
		Armor = AutoResolve_ElvenEntArmor
	End

	AutoResolveWeapon
		Weapon = AutoResolve_ElvenEntWeapon
	End

End

