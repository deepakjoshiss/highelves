	End

  Behavior = PassiveAreaEffectBehavior ModuleTag_EntHealing ;,;
      UpgradeRequired = Upgrade_ElvenEntMootLevel2 ;,;
	  EffectRadius			= ELVEN_ENT_HEAL_AOE_RADIUS // please update the decal size in experience lvl INI if you change this... the value there is about 2.2x the value here
	  PingDelay				= 2000 ;msec
	  HealPercentPerSecond	= 2%
	  AllowFilter				= NONE +RohanEntBirch +RohanEntFir +RohanEntAsh +RohanEntOak +RohanGenericEnt +RohanEntAshMelee +RohanEntAshMelee_Summoned +RohanEntBirch_Summoned +RohanEntFir_Summoned +RohanEntAsh_Summoned +RohanEntOak_Summoned +RohanTreeBerd
	  NonStackable			= No
	  HealFX					= FX_SpellHealUnitHealBuff
  End

    Behavior = PassiveAreaEffectBehavior ModuleTag_EntHealing2 ;,;
      UpgradeRequired = Upgrade_ElvenEntMootLevel3
	  EffectRadius			= ELVEN_ENT_HEAL_AOE_RADIUS // please update the decal size in experience lvl INI if you change this... the value there is about 2.2x the value here
	  PingDelay				= 2000 ;msec
	  HealPercentPerSecond	= 1%
	  AllowFilter				= NONE +RohanEntBirch +RohanEntFir +RohanEntAsh +RohanEntOak +RohanGenericEnt +RohanEntAshMelee +RohanEntAshMelee_Summoned +RohanEntBirch_Summoned +RohanEntFir_Summoned +RohanEntAsh_Summoned +RohanEntOak_Summoned +RohanTreeBerd
	  NonStackable			= No
	  HealFX					= FX_SpellHealUnitHealBuff
  End

