  BuildCost			= ELVEN_ENT_MOOT_COST
  RefundValue			= ELVEN_ENT_REFUND_AMOUNT
  BuildTime			= ELVEN_ENT_MOOT_BUILD_TIME ; in seconds... yes this is very very very very very long
  BountyValue         		= ELVEN_ENT_MOOT_BOUNTY_VALUE ;;,;; ELVEN_ENT_REFUND_AMOUNT

  VisionRange			= ELVEN_ENT_MOOT_VISION_RANGE  ;,; VISION_ENT ;;.;; VISION_HERO_RANGED
  ShroudClearingRange		= ELVEN_ENT_MOOT_VISION_RANGE ;,; SHROUD_CLEAR_ENT ;;.;; SHROUD_CLEAR_STANDARD

  ArmorSet
    Conditions			= None
    Armor			= EntMootArmor
    ;DamageFX			= StructureDamageFXNoShake
  End

 CommandSet = ElvenEntMootCommandSet ;,; EntsMootCommandSet


	; *** AUDIO Parameters ***

	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

	VoiceFullyCreated				= EVA:EntMootComplete
	VoiceSelect						= RohanEntMootSelect	;EntMootSelect
 	VoiceSelectUnderConstruction	= DontBeHasty
 	VoiceTaskComplete				= EntsToWar

	SoundOnDamaged				= BuildingLightDamageWood
	SoundOnReallyDamaged		= BuildingHeavyDamageWood

	ClientBehavior = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap = 800
 		AnimationSound = Sound:EntMootConstructionBoulderSmallRise Animation:FBEntmoot_A.FBEntmoot_A Frames:92 168 254 336 399 474 551 634 705 795 860 885
 		AnimationSound = Sound:EntMootConstructionBoulderLargeRise Animation:FBEntmoot_A.FBEntmoot_A Frames:910
	End


  ; *** ENGINEERING Parameters ***

  RadarPriority       	= STRUCTURE
  KindOf              	= PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION FS_FACTORY MP_COUNT_FOR_VICTORY AUTO_RALLYPOINT CHUNK_VENDOR ;,; Added CHUNK_VENDOR ;DO_NOT_PICK_ME_WHEN_BUILDING

  Behavior           	= GettingBuiltBehavior GetBuiltBehaviorTag
    WorkerName		= ElvenWorkerNoSelect
    SpawnTimer		= DEFAULT_STRUCTURE_HEALDELAY
  End

  Body                	= StructureBody ModuleTag_05
    MaxHealth         	= ELVEN_ENT_MOOT_HEALTH
    MaxHealthDamaged  	= ELVEN_ENT_MOOT_HEALTH_DAMAGED ;,; 4000
    MaxHealthReallyDamaged = ELVEN_ENT_MOOT_HEALTH_REALLY_DAMAGED ;,; 2000

	    GrabObject = EntThrownBuildingRock ;,;
    GrabFX = FX_WallGrab ;,;
    GrabDamage = ROHAN_TREEBEARD_CHUNK_GRAB_DAMAGE ;,;
    GrabOffset = X:16 Y:0 ;,;
  End

  	Flammability      ; should be after the 'Body' statement ;,;
	   Fuel		             = GENERIC_FIRE_FUEL
	   MaxBurnRate	 = GENERIC_FIRE_MAX_BURN_RATE
	   Decay		         = GENERIC_FIRE_DECAY
	   Resistance	     = GENERIC_FIRE_RESISTANCE
	End

  ;,;Flammability   ; should be after the 'Body' statement
		;,;Fuel          =   ELVEN_ENTMOOT_FIRE_FUEL
