;------------------------------------------------------------------------------
;Tainted land object
Object TaintLand

	; *** ART Parameters ***
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor  = Yes
		UseStandardModelNames = Yes
		DefaultModelConditionState
			Model = NONE
			ParticleSysBone = None TaintHCPing HouseColor:yes
		End
		
		MultiPlayerOnly = No ;,; Yes
	End 

	; *** AUDIO Parameters ***
 
	; ***DESIGN parameters ***
	DisplayName     = OBJECT:TaintedLand
	Side            = Mordor
	EditorSorting   = STRUCTURE
	ThreatLevel		= 0.5

	; *** ENGINEERING Parameters ***  
	RadarPriority       = NOT_ON_RADAR
	KindOf              = PRELOAD UNATTACKABLE IMMOBILE TAINT

	Behavior = AttributeModifierAuraUpdate ModuleTag_TaintedLandOne
		StartsActive		= Yes ;If no, requires upgrade to turn on.
		BonusName			= GenericBuff
		RefreshDelay		= 2000
		Range				= SPELLBOOK_TAINT_RADIUS
		ObjectFilter		= GENERIC_BUFF_RECIPIENT_OBJECT_FILTER
		RunWhileDead		= Yes
		RequiredConditions	= TAINT ; In case elven wood and taint overlap, this flag makes it double check the cell type of the target
	End

	Behavior = DeletionUpdate ModuleTag_LifeTimeUpdate
		MinLifetime		= SPELLBOOK_TAINT_TIME
		MaxLifetime		= SPELLBOOK_TAINT_TIME
	End


	GeometryIsSmall		= No
	;Shadow				= SHADOW_VOLUME
End

ChildObject IsengardTaintLand TaintLand ;;,;; added for 2.02e

	Behavior = AttributeModifierAuraUpdate ModuleTag_PillageAura
		StartsActive		= Yes
		BonusName			= TaintOutlawLeadership
		RefreshDelay		= 2000
		Range				= SPELLBOOK_TAINT_RADIUS
		ObjectFilter		= ANY +INFANTRY +CAVALRY -STRUCTURE -BASE_FOUNDATION -DOZER
		RunWhileDead		= Yes
		RequiredConditions	= TAINT ; In case elven wood and taint overlap, this flag makes it double check the cell type of the target
		AntiCategory			= STUN ;,;
	End
End
Object InvisibleTaintObject
	
	SelectPortrait = None 

	Draw = W3DScriptedModelDraw ModuleTag_Draw
	
		DefaultModelConditionState
			Model               = None 
			

				Shadow =  SHADOW_ALPHA_DECAL_DYNAMIC
				ShadowSizeX = 480 
				ShadowSizeY = 480 
				ShadowTexture = EXTaint;
				
				ShadowOpacityStart = 0
				ShadowOpacityFadeInTime = 1000
				ShadowOpacityPeak = 175
				ShadowOpacityFadeOutTime = 1000
				ShadowOpacityEnd = 0
				ShadowOverrideLODVisibility = YES
		End
		
	

	End

	; ***DESIGN parameters ***
	Side            = Mordor
	EditorSorting		= MISC_MAN_MADE
	KindOf				= PRELOAD UNATTACKABLE TAINT IGNORE_FOR_VICTORY ;,; Removed IMMOBILE
	;Shadow				= SHADOW_VOLUME
	RadarPriority		= NOT_ON_RADAR
	CommandSet = EmptyCommandSet 
	
	ArmorSet 
        Conditions        = None
        Armor             = InvulnerableArmor
    End
	
	Body            = ActiveBody ModuleTag_Body
		MaxHealth	= 200
	End

	Behavior = DestroyDie ModuleTagDeath_Die
		DeathTypes = ALL
	End
	
		Behavior = DeletionUpdate ModuleTag_LifeTimeUpdate
		MinLifetime		= SPELLBOOK_TAINT_TIME
		MaxLifetime		= SPELLBOOK_TAINT_TIME
	End

;,;	Geometry				= CYLINDER
