    GeometryContactPoint = X:24.0		Y:-17.0	Z:0		Repair ;,;
    GeometryContactPoint = X:-11.0	Y:17.0		Z:0		Repair ;,;
    GeometryContactPoint = X:-11.0	Y:-17.0	Z:0		Repair ;,;
	
	GeometryIsSmall       = No
	Shadow                = SHADOW_VOLUME
	BuildCompletion     = PLACED_BY_PLAYER
End
