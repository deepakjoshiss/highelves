;//------------------------------------------------------------------------------------------
;//Wild Arrow Den Expansion
Object WildSpiderHolesExpansion

	SelectPortrait =  UPWild_Spiderlings

  	;// *** ART Parameters ***
	ButtonImage = BRBattleTower
	  
	;// *** ART Parameters ***
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		OkToChangeModelColor	= Yes
		UseStandardModelNames	= Yes
		StaticModelLODMode		= No ;,;Yes
		
		DefaultModelConditionState
			Model = WBSHole			
		End

		ModelConditionState	= UPGRADE_NUMENOR_STONEWORK ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model	= WBSHole_A
			Texture	= WBFortress.tga WBFortress_U.tga
		End

		ModelConditionState = SNOW ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model			= WBSHole_A
			Texture			= WBFortress.tga WBFortress_snow.tga
		End 	
		
		ModelConditionState = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
			Model			= WBSHole_A			
		End

		AnimationState = ACTIVELY_BEING_CONSTRUCTED	PARTIALLY_CONSTRUCTED
			Animation					= UpAndStill
				AnimationName			= WBSHole_ASKL.WBSHole_ABLD
				AnimationMode			= MANUAL
			End
			Flags = START_FRAME_FIRST
			ParticleSysBone   = NONE BuildingContructDustExpB
			ParticleSysBone   = NONE ExpWild
			BeginScript
				CurDrawablePlaySound("GondorBarracksBeginConstruction")
			EndScript
		End

		//---Damage States---
		ModelConditionState = DAMAGED
			Model	= WBSHole
			Texture	= WBFortress.tga WBFortress_D.tga
		End
		AnimationState = DAMAGED
			EnteringStateFX	= FX_BuildingDamaged
		End	    

		ModelConditionState = REALLYDAMAGED
			Model		= WBSHole_D2			
		End

		AnimationState	= REALLYDAMAGED
			Animation	= WBSHole_ReallyDamaged
				AnimationName		= WBSHole_D2SKL.WBSHole_D2AN
				AnimationMode		= ONCE				
			End
			EnteringStateFX	= FX_BuildingReallyDamaged		
		End

		ModelConditionState = RUBBLE
			Model			= WBSHole_D3			
			ParticleSysBone SmokeLarge01 SmokeBuildingLarge
		End

		AnimationState	= RUBBLE
			Animation	= WBSHole_ReallyDamaged
				AnimationName		= WBSHole_D3SKL.WBSHole_D3AN
				AnimationMode		= ONCE				
			End	
			EnteringStateFX	= FX_StructureMediumCollapse		
		End
		
		ModelConditionState	= UPGRADE_NUMENOR_STONEWORK
			Model			= WBSHole
			Texture			= WBFortress.tga WBFortress_U.tga
		End

		ModelConditionState = SNOW 
			Model			= WBSHole
			Texture			= WBFortress.tga WBFortress_snow.tga
		End		
	End
 
	// ***DESIGN parameters ***
	DisplayName         = OBJECT:WildSpiderHolesExpansion
	Description	= CONTROLBAR:WildSpiderHolesExpansionDescription ;,; 
	Side                = Wild
	EditorSorting       = STRUCTURE
	ThreatLevel 		= 11.0
	IsTrainable			= No
	 
	BuildCost           = 0 ;,;WILD_SPIDERHOLESEXPANSION_BUILD_COST
	BuildTime           = WILD_SPIDERHOLESEXPANSION_BUILD_TIME	;// in seconds
	VisionRange         = VISION_BASE_DEFENSE
 	ShroudClearingRange = SHROUD_CLEAR_BASE_DEFENSE

	CommandSet = SellableCommandSet
	ArmorSet
		Conditions        = None
		Armor             = FortressExpansionArmor		
	End

	// *** AUDIO Parameters ***
	#include "..\..\..\Includes\StandardBuildingEvaEvents.inc"

	VoiceSelect						= WildSpiderPitSelect
	VoiceSelectUnderConstruction	= BuildingEvilVoiceSelectUnderConstruction

	SoundOnDamaged					= BuildingLightDamageStone
	SoundOnReallyDamaged			= BuildingHeavyDamageStone

	UnitSpecificSounds
		UnderConstruction			= BuildingConstructionLoop  ;// Built first time
		;//UnderRepairFromDamage	= NoSound					;// Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble		= BuildingConstructionLoop	;// Repaired from completely destroyed (not used???)
	End

	CampnessValue = CAMPNESS_FORTRESS_EXPANSION

	;// *** ENGINEERING Parameters ***
	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION CAN_ATTACK FS_BASE_DEFENSE MADE_OF_STONE CHUNK_VENDOR ;,; Added CHUNK_VENDOR
	 
	Behavior	= GettingBuiltBehavior ModuleTag_04
		WorkerName	= WildLaborerNoSelect
		SpawnTimer	= DEFAULT_STRUCTURE_HEALDELAY
	End

	Body		= StructureBody ModuleTag_05
		MaxHealth               = WILD_SPIDERHOLESEXPANSION_HEALTH
		MaxHealthDamaged        = WILD_SPIDERHOLESEXPANSION_HEALTH_DAMAGED
		MaxHealthReallyDamaged  = WILD_SPIDERHOLESEXPANSION_HEALTH_REALLY_DAMAGED
		
		    GrabObject = EntThrownBuildingRock ;,;
    GrabFX = FX_WallGrab ;,;
    GrabDamage = ROHAN_TREEBEARD_CHUNK_GRAB_DAMAGE ;,;
    GrabOffset = X:16 Y:0 ;,;
	End

	;,;Behavior = SlowDeathBehavior ModuleTag_SlowDeathWithoutRubble
		;,;DestructionDelay  = 4000
	;,;End

	 Flammability ;,;FakeFlameModule
	   Fuel		             = FAKE_FIRE_FUEL
	   MaxBurnRate	 = FAKE_FIRE_MAX_BURN_RATE
	   Decay		         = FAKE_FIRE_DECAY
	   Resistance	     = FAKE_FIRE_RESISTANCE
	End

 	Behavior = FireWeaponUpdate ModuleTag_FireWeaponUpdate ;,;
		FireWeaponNugget
			WeaponName = ExpansionShadowKiller
			FireDelay = 0
			OneShot = Yes
		End
  End

;,;===========================================================================;,;
    Behavior = ObjectCreationUpgrade ModuleTag_MakeEligibleForRefund ;,;
        TriggeredBy             = Upgrade_MordorFaction Upgrade_WildFaction Upgrade_AngmarFaction Upgrade_ArnorFaction Upgrade_IsengardFaction Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction
        Delay                   = 0.0
        GrantUpgrade            = Upgrade_ObjectLevel10 
    End
    Behavior = ObjectCreationUpgrade ModuleTag_MakeIneligibleForRefund ;,;
        TriggeredBy             = Upgrade_MordorFaction Upgrade_WildFaction Upgrade_AngmarFaction Upgrade_ArnorFaction Upgrade_IsengardFaction Upgrade_MenFaction Upgrade_DwarfFaction Upgrade_ElfFaction
        Delay                   = 50000.0
        RemoveUpgrade           = Upgrade_ObjectLevel10 
    End
;,;-----------------------------------------------------------------------------------------------------------;,;
    Behavior           = CreateObjectDie ModuleTag_SpawnRefundObject ;,; 
        ExemptStatus   = SOLD 
        RequiredStatus   = BUILD_BEING_CANCELED 
        CreationList   = OCL_SpawnUniqueExpansionRefund_2
        DeathTypes   = NONE +NORMAL
        ;MinKillerAngle   = 0 ;,; required not to spawn OCL when we cancel construction
        ;MaxKillerAngle   = 360 ;,; required not to spawn OCL when we cancel construction
        UpgradeRequired   = Upgrade_ObjectLevel10
    End
;,;===========================================================================;,;

	Behavior = SlowDeathBehavior ModuleTag_SlowDeath ;,;
		DeathTypes		= ALL 
		DestructionDelay  = 2500
		OCL = INITIAL OCL_FortressExpansionPadCornerKiller
	End

	Behavior                  = StructureCollapseUpdate ModuleTag_StructureCollapseUpdate 
		MinCollapseDelay        = 1000 ;,;000
		MaxCollapseDelay        = 1000 ;,;000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapseNoSound
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight			= 89
	End
	
	Behavior = TerrainResourceBehavior ModuleTag_NewMoneyDeadSpot
		Radius			= TERRAIN_CLAIM_RADIUS ;,; 100		;// How far we try to claim ground
		MaxIncome		= 0			;// If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval	= 999999	;// How often (in msec) we give that much money
		HighPriority	= Yes		;// A high priority claim gets to pretend it was there first.
		Visible = No 		;// Don't show decal when a resource building is selected.
	End


	Behavior	= BuildingBehavior BuildingModuleTag
		NightWindowName		= WINDOW_N01
		;//FireWindowName   = WINDOW_F01
		;//GlowWindowName	= WINDOW_G01
	End

	Behavior = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle	= Yes
		MoodAttackCheckRate			= 250
	End

    Behavior = CastleMemberBehavior ModuleTag_CMB
    End 

	Behavior = ProductionUpdate ProductionUpdateModuleTag	
	End
	Behavior = QueueProductionExitUpdate ModuleTag_11
		UnitCreatePoint			= X:-15.0 Y:0.0 Z:0.0
		NaturalRallyPoint		= X:-15.0 Y:0.0 Z:0.0
		ExitDelay				= 300
		NoExitPath				= Yes
	End

	Behavior = SpawnBehavior ModuleTag_SpawnFighters
		SpawnNumber				= 9
		InitialBurst			= 9
		SpawnTemplateName		= WildSpiderling_Slaved
		SpawnReplaceDelay		= 3000
		FadeInTime				= 1000
		SpawnInsideBuilding		= Yes
	End

	;//Web Cocoon
	Behavior = AttributeModifierUpgrade ModuleTag_Reinforced
		TriggeredBy				= Upgrade_WildFortressWebCocoon
		AttributeModifier		= WebCocoonExpansion_Bonus
	End

	Behavior = ModelConditionUpgrade ModuleTag_ShowWebCocoon
		TriggeredBy				= Upgrade_WildFortressWebCocoon		
		AddConditionFlags		= UPGRADE_NUMENOR_STONEWORK
		Permanent				= Yes
	End

	Geometry				= BOX
	GeometryMajorRadius		= 4
	GeometryMinorRadius		= 4
	GeometryHeight			= 30.0
	GeometryOffset			= X:4 Y:-20 Z:0	

	AdditionalGeometry		= BOX
	GeometryMajorRadius		= 4
	GeometryMinorRadius		= 4
	GeometryHeight			= 30.0
	GeometryOffset			= X:4 Y:20 Z:0	

	AdditionalGeometry		= BOX
	GeometryMajorRadius		= 30
	GeometryMinorRadius		= 20
	GeometryHeight			= 40.0 ;;,;; 5.0
	GeometryOffset			= x:-20 Y:0 Z:0 ;;,;; X:-20 Y:0 Z:20
    ;;,;; No longer immune to Gothmog, etc.
	    
	GeometryIsSmall			= No
	Shadow					= SHADOW_VOLUME
	BuildCompletion			= PLACED_BY_PLAYER

	//Scale					= 1.30
	
	GeometryContactPoint 	= X:23.624		Y:23.464	Z:0			Repair
	GeometryContactPoint 	= X:22.954		Y:-16.306	Z:0			Repair
	GeometryContactPoint 	= X:22.954		Y:15.951	Z:0
	GeometryContactPoint 	= X:5.435		Y:-23.279	Z:0
	GeometryContactPoint 	= X:-0.459		Y:-0.275	Z:116.828	Swoop

End
ChildObject WildSpiderHolesExpansionCustom WildSpiderHolesExpansion ;,;
