ChildObject RockBigTreeberd RockBigEnt ;;,;; Added for 2.1

	;;,;; Treebeard Leadership, Version 2.1.  Obviously I am going to great extents to make sure it looks like Treebeard Leadership sticks around.
	;;,;; Do this just once - we don't want units near the rock to end up with Leadership after it has flown far away from Treebeard.
	Behavior = FireWeaponUpdate ModuleTag_WeaponFiringApplyAttributeModifier
		FireWeaponNugget
			WeaponName = MakeTreeBeardLeadershipCasterForTreeBeardRock
			Offset = X:0 Y:0 Z:0
			FireDelay = 0
			OneShot = Yes
		End
	End
	
End

