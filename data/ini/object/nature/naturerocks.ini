Object IronHillsRockyOutcropping01 ;,;
  Draw = W3DScriptedModelDraw ModuleTag_01
	DefaultModelConditionState
		Model = PIronHillsOut01
	End
    AnimationState = REALLYDAMAGED
		EnteringStateFX	= FX_RedRockReallyDamaged
    End
    ModelConditionState = REALLYDAMAGED
		Texture	= pironhillsoutcrop01.tga pironhillsoutcrop01_rd.tga
    End	
    ModelConditionState = DYING
		Texture	= pironhillsoutcrop01.tga pironhillsoutcrop01_rd.tga
    End	
END

	ArmorSet
		Conditions        = None
		Armor             = StructureArmor
		DamageFX        = RedRockDamageFX
	End
	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE LINKED_TO_FLAG CAN_CAST_REFLECTIONS NOT_AUTOACQUIRABLE 
	Behavior = KeepObjectDie ModuleTag_IWantRubble
		StayOnRadar				= No
	End
	Body                        = StructureBody ModuleTag_05
		MaxHealth         		    = 8000
		MaxHealthReallyDamaged 		= 4000
	End
	Behavior                  = StructureCollapseUpdate ModuleTag_08
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_RedRockDestroyed
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= No
		CollapseHeight			= 125
	End

	Geometry            = CYLINDER
	GeometryIsSmall     = No
	GeometryMajorRadius = 50
	GeometryHeight      = 60
	GeometryOffset      = X:0 Y:0 Z:0  
END

