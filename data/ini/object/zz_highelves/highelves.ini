Object LightOfTreesWeatherChanger
;,;--------------------------------------------------------------------------------------;,;
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model           = none
		End
	End
	
	EvaEnemyObjectSightedEvent = None  ; Not a real unit
  
	; ***DESIGN parameters ***
	EditorSorting   = SYSTEM
	KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE INERT
	

	; *** ENGINEERING Parameters ***
	Body = ImmortalBody ModuleTag_02
		MaxHealth = 1    
		InitialHealth = 1
	End

	Behavior = DeletionUpdate ModuleTag_03 ; Not LifetimeUpdate, since I can't die.  This will DestroyObject me. 
		MinLifetime = 1000
		MaxLifetime = 1000
	End

	Behavior = FireWeaponUpdate ModuleTag_KillAllCurrentWeather
		FireWeaponNugget
			WeaponName	= WeatherKillerLightOfTrees ;,; WeatherKiller (which now also clears Light of the Trees' sunbeams, this cast's included)
			Offset = X:0 Y:0 Z:0
			FireDelay	= 0
			OneShot		= Yes
		End
	End

	Behavior = FireWeaponUpdate ModuleTag_MakeTheDarknessCaster
		FireWeaponNugget
			WeaponName	= MakeLightOfTreesCaster
			Offset = X:0 Y:0 Z:0
			FireDelay	= 50
			OneShot		= Yes
		End
	End

End


